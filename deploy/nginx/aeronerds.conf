# AeroNerds SIH26011 — nginx reverse proxy.
#
# The app container is bound to 127.0.0.1:8000 and speaks plain HTTP, so this
# is the only thing exposed publicly. It terminates TLS and serves the large
# GeoJSON layers with sensible caching.

# ---------- rate limiting: the auth endpoint is the thing worth protecting ----
limit_req_zone $binary_remote_addr zone=aeronerds_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=aeronerds_api:10m rate=60r/s;

# ---------- HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # ACME challenges must stay on plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- the site ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.example;

    # lets the container see the real client address
    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # The basemap is Carto styles + Esri World Imagery tiles, and the 3D libs and
    # icons come from unpkg. Every host below is one the portal genuinely loads.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://basemaps.cartocdn.com; font-src 'self' data: https://fonts.gstatic.com https://basemaps.cartocdn.com; img-src 'self' data: blob: https://server.arcgisonline.com https://*.basemaps.cartocdn.com; connect-src 'self' https://basemaps.cartocdn.com https://server.arcgisonline.com; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'" always;

    # GeoJSON layers are large and change rarely
    client_max_body_size 4m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/geo+json;
    gzip_min_length 1024;

    # ---------- the API ----------
    location /api/ {
        limit_req zone=aeronerds_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- sign-in, throttled hard ----------
    location /api/auth/login {
        limit_req zone=aeronerds_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- static layers, cached hard ----------
    location /data/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600" always;
        expires 1h;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800" always;
        expires 7d;
    }

    # ---------- everything else (homepage, portal, css, js) ----------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache" always;
    }

    # never serve the auth database or any dotfile
    location ~* \.(db|sqlite|sqlite3)(-journal|-wal|-shm)?$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }
}
