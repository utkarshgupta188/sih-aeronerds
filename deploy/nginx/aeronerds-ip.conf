# AeroNerds SIH26011 — nginx reverse proxy for an IP-only instance (no TLS).
#
# Use this INSTEAD of aeronerds.conf when the instance has no domain name.
# Let's Encrypt cannot issue a certificate for a bare IP address, so there is
# no way to serve this over HTTPS on 65.0.71.122 alone. Everything else in
# aeronerds.conf still applies: rate limiting, the CSP, the security headers,
# the database block, and the cache rules.
#
# What is genuinely lost, and it is not small:
#
#   * Credentials cross the network in cleartext. Sign-in posts the username
#     and password base64-encoded over plain HTTP, readable by anyone on the
#     path. Do not use real accounts, and do not treat the deployed instance
#     as safe for real citizen grievance data.
#   * No HSTS, because there is no HTTPS to pin.
#   * The auth rate limit is the only brake on credential stuffing, so the
#     demo passwords must be changed before this instance is reachable.
#
# To get a proper HTTPS URL for free instead, use a free hostname and switch to
# aeronerds.conf. See docs/DEPLOY_AWS.md.

# ---------- rate limiting: the auth endpoint is the thing worth protecting ----
limit_req_zone $binary_remote_addr zone=aeronerds_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=aeronerds_api:10m rate=60r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # "_" catches requests by IP, where there is no hostname to match on
    server_name _;

    server_tokens off;

    # Do not advertise the nginx version in error pages or headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # The basemap is Carto styles + Esri World Imagery tiles, and the 3D libs and
    # icons come from unpkg. Every host below is one the portal genuinely loads.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://basemaps.cartocdn.com; font-src 'self' data: https://fonts.gstatic.com https://basemaps.cartocdn.com; img-src 'self' data: blob: https://server.arcgisonline.com https://*.basemaps.cartocdn.com; connect-src 'self' https://basemaps.cartocdn.com https://server.arcgisonline.com; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'" always;
    # No Strict-Transport-Security: it is meaningless over HTTP and would be
    # ignored rather than protecting anything.

    # GeoJSON layers are large and change rarely
    client_max_body_size 4m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/geo+json;
    gzip_min_length 1024;

    # ---------- the API ----------
    location /api/ {
        limit_req zone=aeronerds_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- sign-in, throttled hard ----------
    # nginx picks the longest matching prefix, so this wins over /api/ above.
    location /api/auth/login {
        limit_req zone=aeronerds_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- static layers, cached hard ----------
    location /data/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600" always;
        expires 1h;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800" always;
        expires 7d;
    }

    # ---------- everything else (homepage, portal, css, js) ----------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache" always;
    }

    # never serve the auth database or any dotfile
    location ~* \.(db|sqlite|sqlite3)(-journal|-wal|-shm)?$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }
}
